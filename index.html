<style>

  .emoji { font-size: 2.6em; flex-shrink: 0; }
  .card h2 { font-size: 1.3em; margin-bottom: 4px; }
  .card p { font-size: 0.85em; color: #888; }
  .badge {
    display: inline-block;
    background: #FF8C42;
    color: #fff;
    font-size: 0.7em;
    border-radius: 10px;
    padding: 2px 10px;
    margin-left: 8px;
    vertical-align: middle;

  .footer { margin-top: 24px; font-size: 0.8em; color: #ccc; }
